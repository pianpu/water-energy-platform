name: Publish water energy platform

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript
        run: |
          node --check app.js
          node --check history.js
          node --check rooms-model.js
          node --check rooms.js
          find '业务平台/原型' -maxdepth 1 -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Check room management
        run: |
          npm install --prefix target/room-check --no-audit --no-fund jsdom@26.1.0
          node --test tests/rooms.test.cjs

      - name: Prepare static site
        run: |
          mkdir -p _site/business
          cp index.html styles.css app.js history.js rooms-model.js rooms.js .nojekyll _site/
          cp 业务平台/原型/*.html 业务平台/原型/*.css 业务平台/原型/*.js _site/business/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
